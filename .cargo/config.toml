[alias]
accuracy-test = "run -p divvunspell-cli --features accuracy --release -- accuracy"

# crates/divvun-fst-python is a Python extension module, which the interpreter
# that imports it supplies libpython to. Built as maturin builds it, it links
# no libpython, so `cargo build --workspace` needs no Python library on the
# host.
[env]
PYO3_BUILD_EXTENSION_MODULE = "1"
